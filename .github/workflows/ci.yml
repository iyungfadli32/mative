name: MaTive CI — Phase 1

# Lint → typecheck → unit test → production build.
# Migrasi/RLS test (pgTAP) + e2e critical flow BUTUH database live dan
# dijalankan terpisah oleh koordinator (lihat docs/apply-migrations.md);
# CI ini TIDAK mengklaim keduanya lolos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Secret scan (fail bila ada kunci di file yang di-commit)
        run: |
          # Pola kunci ASLI (panjang): pola regex di tests/ tidak ikut terhitung
          # karena memakai kelas karakter, bukan 10+ karakter kunci berturut-turut.
          if grep -RInE 'sb_publishable_[A-Za-z0-9]{10,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9]{10,}' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=tests --exclude=.env.local . ; then
            echo "SECRET TERDETEKSI di file yang di-commit — perbaiki sebelum merge."
            exit 1
          fi
          echo "Secret scan: bersih."

      - name: Production build (tanpa kredensial — harus lolos)
        run: npm run build

      - name: Smoke test (Playwright, halaman publik)
        # Smoke test menegaskan /api/health supabaseConfigured=true, jadi
        # langkah ini BUTUH dua variabel PUBLIK di bawah (tanpa keduanya,
        # health mengembalikan false dan CI selalu merah).
        # URL ditulis literal (publik, aman). Kunci publishable TIDAK ditulis
        # literal di sini karena secret-scan repo menolak pola sb_publishable_
        # di file yang di-commit — nilainya diambil dari GitHub Actions
        # Variable repo (Settings -> Secrets and variables -> Actions ->
        # Variables): NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, diisi dari
        # Supabase Dashboard -> Settings -> API -> Publishable key.
        # Service-role key TIDAK BOLEH masuk CI dalam bentuk apa pun.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kwyqtlxglhlvtghfrnhr.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts --project=chromium
